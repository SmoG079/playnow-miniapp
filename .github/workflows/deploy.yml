name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the backend to Tencent Cloud
        type: boolean
        default: false
      bootstrap:
        description: First production adoption (maintenance window required)
        type: boolean
        default: false
      upload_miniprogram:
        description: Upload a WeChat experience version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/smog079/playnow-miniapp-api

jobs:
  backend-test:
    name: Backend validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_pass
          MYSQL_DATABASE: test_db
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: mysql+asyncmy://root:test_pass@127.0.0.1:3306/test_db
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install dependencies
        run: pip install -r requirements-test.txt
      - name: Syntax and backend tests
        run: |
          python -m compileall app alembic scripts -q
          python -m unittest tests/test_free_post_queries.py
          python -m unittest tests/test_http_routes.py tests/test_pricing.py
          python -m pytest tests/test_rate_limit.py tests/test_bookings.py tests/test_settlement.py tests/test_tournament_engine.py tests/test_tournaments.py tests/test_post_booking_permissions.py tests/test_record_persistence.py tests/test_activity_ids.py tests/test_event_management.py tests/test_activity_media.py -m "not deferred_booking_payments"
      - name: Empty database migration
        if: ${{ !cancelled() }}
        run: |
          python -m alembic upgrade head
          python -m alembic upgrade head
          TOURNAMENT_MYSQL_TEST_DATABASE_URL="$DATABASE_URL" python -m pytest tests/test_tournament_mysql.py
          ACTIVITY_MYSQL_TEST_DATABASE_URL="$DATABASE_URL" ACTIVITY_REDIS_TEST_URL=redis://127.0.0.1:6379/15 python -m pytest tests/test_activity_mysql.py tests/test_activity_cleanup_mysql.py
      - name: HTTP business flow on disposable CI database
        env:
          DEBUG: 'true'
          LOG_LEVEL: WARNING
          PUBLIC_BASE_URL: http://127.0.0.1:18080
          FULLFLOW_REPORT: fullflow-result.json
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18080 > /tmp/playnow-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:18080/health", timeout=1)
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("CI API did not start")
          PY
          python tests/http_fullflow.py
      - name: Save HTTP flow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-fullflow-${{ github.sha }}
          path: backend/fullflow-result.json
          if-no-files-found: ignore
      - name: Deployment script tests
        if: ${{ !cancelled() }}
        working-directory: .
        run: python -m unittest discover -s tests -p 'test_deployment*.py' -v

  frontend-check:
    name: Uni-app validation and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run check:miniprogram
      - uses: actions/upload-artifact@v4
        with:
          name: mp-weixin-${{ github.sha }}
          path: frontend/dist/build/mp-weixin
          if-no-files-found: error
          retention-days: 7

  deploy-preflight:
    name: Deployment configuration
    needs: [backend-test, frontend-check]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    environment: product
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
    steps:
      - name: Check deployment secrets
        shell: bash
        run: |
          missing=0
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY SERVER_PROJECT_PATH SERVER_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing from product environment"
              missing=1
            fi
          done
          exit "$missing"

  backend-image-check:
    name: Backend image build check
    needs: backend-test
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-build:
    name: Build immutable backend image
    needs: deploy-preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend-deploy:
    name: Deploy and verify production
    needs: backend-build
    runs-on: ubuntu-latest
    environment: product
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy through verified SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DEPLOY_BOOTSTRAP: ${{ inputs.bootstrap && 'true' || 'false' }}
        run: python scripts/remote-deploy.py

  miniprogram-upload:
    name: Upload WeChat experience version
    needs: [frontend-check, backend-deploy]
    if: github.ref == 'refs/heads/master' && ((github.event_name == 'workflow_dispatch' && inputs.upload_miniprogram) || (github.event_name == 'push' && vars.AUTO_UPLOAD_MINIPROGRAM == 'true'))
    runs-on: ubuntu-latest
    environment: product
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mp-weixin-${{ github.sha }}
          path: frontend/dist/build/mp-weixin
      - name: Upload experience version
        env:
          WX_MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WX_MINIPROGRAM_PRIVATE_KEY }}
          WX_MINIPROGRAM_PRIVATE_KEY_BASE64: ${{ secrets.WX_MINIPROGRAM_PRIVATE_KEY_BASE64 }}
          WX_MINIPROGRAM_ROBOT: ${{ secrets.WX_MINIPROGRAM_ROBOT || '1' }}
          WX_MINIPROGRAM_VERSION: 0.1.${{ github.run_number }}
          WX_MINIPROGRAM_UPLOAD_DESC: master ${{ github.sha }}
        run: npm run upload:miniprogram
