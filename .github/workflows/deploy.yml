name: CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      upload_miniprogram:
        description: Upload WeChat experience version
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smog079/playnow-miniapp-api

jobs:
  cicd-preflight:
    name: CI/CD secret preflight
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
      WX_MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WX_MINIPROGRAM_PRIVATE_KEY }}
      WX_MINIPROGRAM_PRIVATE_KEY_BASE64: ${{ secrets.WX_MINIPROGRAM_PRIVATE_KEY_BASE64 }}
    steps:
      - name: Check required secrets
        run: |
          set -e
          missing=0

          require() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::$name is missing"
              missing=1
            fi
          }

          require SERVER_HOST "$SERVER_HOST"
          require SERVER_USER "$SERVER_USER"
          require SERVER_SSH_KEY "$SERVER_SSH_KEY"
          require SERVER_PROJECT_PATH "$SERVER_PROJECT_PATH"

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.upload_miniprogram }}" = "true" ]; then
            if [ -z "$WX_MINIPROGRAM_PRIVATE_KEY" ] && [ -z "$WX_MINIPROGRAM_PRIVATE_KEY_BASE64" ]; then
              echo "::error::WX_MINIPROGRAM_PRIVATE_KEY or WX_MINIPROGRAM_PRIVATE_KEY_BASE64 is missing"
              missing=1
            fi
          fi

          exit "$missing"

  backend-test:
    name: Backend validation
    needs: cicd-preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_pass
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Syntax check
        run: python -m compileall app -q

      - name: Unit tests
        env:
          DATABASE_URL: mysql+asyncmy://root:test_pass@127.0.0.1:3306/test_db
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-test-key
        run: |
          python -m unittest tests/test_free_post_queries.py
          pytest tests/test_rate_limit.py tests/test_bookings.py tests/test_settlement.py

  miniprogram-check:
    name: Mini program validation
    needs: cicd-preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mini program checks
        run: npm run check:miniprogram

  backend-build-and-deploy:
    name: Build backend image and deploy
    needs: backend-test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to cloud server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.SERVER_PROJECT_PATH }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api alembic upgrade head
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api python - <<'PY'
            import json
            import urllib.request

            with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=15) as response:
                body = response.read().decode("utf-8")
                if response.status != 200:
                    raise SystemExit(f"health check failed: {response.status} {body}")
                data = json.loads(body)
                if data.get("status") != "ok":
                    raise SystemExit(f"unexpected health body: {body}")
            PY
            docker image prune -f

  miniprogram-upload:
    name: Upload WeChat experience version
    needs:
      - miniprogram-check
      - backend-build-and-deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.upload_miniprogram == 'true'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upload experience version
        env:
          WX_MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WX_MINIPROGRAM_PRIVATE_KEY }}
          WX_MINIPROGRAM_PRIVATE_KEY_BASE64: ${{ secrets.WX_MINIPROGRAM_PRIVATE_KEY_BASE64 }}
          WX_MINIPROGRAM_ROBOT: ${{ secrets.WX_MINIPROGRAM_ROBOT || 1 }}
          WX_MINIPROGRAM_VERSION: 0.1.${{ github.run_number }}
          WX_MINIPROGRAM_UPLOAD_DESC: master ${{ github.sha }} after backend deploy
        run: npm run upload:miniprogram
