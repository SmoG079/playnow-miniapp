services:
  nginx:
    image: nginx:alpine
    container_name: club-nginx
    volumes:
      - ./backend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./backend
    container_name: club-api
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+aiomysql://club_user:club_pass@mysql:3306/club_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery_worker:
    build: ./backend
    container_name: club-celery
    command: celery -A app.tasks.worker worker -l info -c 2
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+aiomysql://club_user:club_pass@mysql:3306/club_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  celery_beat:
    build: ./backend
    container_name: club-celery-beat
    command: celery -A app.tasks.worker beat -l info
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+aiomysql://club_user:club_pass@mysql:3306/club_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: club-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: club_db
      MYSQL_USER: club_user
      MYSQL_PASSWORD: club_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: club-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mysql_data:
